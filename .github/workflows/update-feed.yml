name: Update RSS Feed

on:
  schedule:
    # Roda a cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite rodar manualmente

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download RSS feed
        run: |
          mkdir -p public
          curl -sSL "https://www.sobralnoticias.com.br/feeds/posts/default?alt=rss" -o public/feed.xml
          echo "Feed baixado com sucesso"
          ls -la public/feed.xml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza feed de notícias" && git push)